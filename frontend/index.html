<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090B0E" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('citadel_theme');
          var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = (stored === 'dark' || stored === 'light') ? stored : (sysDark ? 'dark' : 'light');
          var metaScheme = document.querySelector('meta[name="color-scheme"]');
          if (metaScheme) metaScheme.content = (stored === 'dark' || stored === 'light') ? stored : 'light dark';
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) metaTheme.content = resolved === 'dark' ? '#090B0E' : '#F8F9FB';
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="EnverAI Artificer - Autonomous Multi-Agent Underwriting Citadel for New-To-Credit MSMEs. Institutional Financial Intelligence." />
    <title>EnverAI Artificer | Autonomous Underwriting Citadel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

  </body>
</html>
